name: Direct Line Group
kind: company
description: >-
  Direct Line Group is a United Kingdom personal-lines and small-commercial
  general insurance carrier, founded in 1985 as the UK's first telephone-only
  motor insurer and listed on the London Stock Exchange from its 2012 IPO until
  Aviva plc completed its GBP 3.7 billion acquisition of the group on 1 July
  2025. The group underwrites motor, home, pet, travel, landlord, breakdown and
  small-business insurance through the Direct Line, Churchill, Privilege, Darwin,
  By Miles, Direct Line for Business and Green Flag brands, and is regulated in
  its home market by the Financial Conduct Authority and the Prudential
  Regulation Authority. Its distribution is direct-to-consumer via telephone and
  web plus price-comparison-website placement (notably through the Darwin
  brand), rather than through broker or agency channels; it sold its brokered
  commercial business (NIG and FarmWeb) to RSA in September 2023, closing the
  one channel that would have carried standards-based broker integration. Its
  API posture is accordingly closed and partner-gated: as of 25 July 2026 the
  corporate domain directlinegroup.co.uk returns HTTP 301 to aviva.com, there is
  no developer.*, developers.* or docs.* host in DNS, every consumer brand site
  returns 404 on /developers, /api and /partners, and the only API host that
  exists — api.directlinegroup.co.uk, resolving to a MuleSoft Anypoint
  production load balancer — serves HTTP 403 behind an expired TLS certificate
  and requests a client certificate during the TLS handshake. There is no public
  self-serve developer portal, no downloadable OpenAPI, no GraphQL, no published
  webhook or event catalog, no public Postman workspace, and no ACORD reference
  anywhere in the group's public material. Quote, bind, issue and FNOL are all
  consumer web and telephone journeys only.
