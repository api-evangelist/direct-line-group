actions:
  openapiDirCreated: false
  apisListed: 0
  status: built-stub
  reason: |
    Identity captured honestly with an empty apis[] block. Direct Line Group
    publishes no public self-serve API, no developer portal and no
    machine-readable specification; its only external API host is a
    partner-gated mTLS MuleSoft gateway returning 403. Recording that absence
    accurately is the correct outcome for this record.
