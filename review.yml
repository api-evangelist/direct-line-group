aid: direct-line-group
name: Direct Line Group
review:
  question: Does Direct Line Group expose a public, self-serve developer portal or
    any documented public insurance API (quote, bind, issue, FNOL)?
  answer: false
  date: '2026-07-25'
  reviewer: API Evangelist
  homeMarket: United Kingdom
  tier: carrier-pc
findings:
  summary: |
    Direct Line Group has no public API surface. It is a UK personal-lines
    carrier that sells direct to consumers by telephone, web and
    price-comparison website; it has no broker or agency channel to integrate
    with, and no developer programme.

    The corporate domain is gone. Both directlinegroup.co.uk and
    www.directlinegroup.co.uk return HTTP 301 to https://www.aviva.com/
    following completion of Aviva plc's GBP 3.7bn acquisition on 1 July 2025,
    so every historical /developers, /api, /developer, /partners and
    /integrations path now terminates at the Aviva homepage rather than at any
    Direct Line content. No developer.*, developers.* or docs.* host exists in
    DNS for the corporate domain (NXDOMAIN).

    One API host does exist and it is the single most useful finding here:
    api.directlinegroup.co.uk resolves to
    dlg-production-load-balancer.lb.anypointdns.net (a MuleSoft Anypoint
    Platform production load balancer, IPv4 99.80.112.117 / 54.195.109.167).
    It is not usable or documented publicly: its TLS certificate has expired,
    the server requests a client certificate during the TLS handshake
    (mutual TLS), and the root path returns HTTP 403 Forbidden with an nginx
    error body. /console, /api, /openapi.json, /swagger.json, /api-docs,
    /health and /status all return 404. This is an internal and partner
    integration gateway, not a developer surface.

    Every live consumer brand site — directline.com, churchill.com,
    greenflag.com, privilege.com, darwin.co.uk, bymiles.co.uk,
    directlineforbusiness.co.uk — returns HTTP 404 on /developers, /api and
    /partners. The one nominally interesting host, docs.directline.com, is a
    login wall: HTTP 200 serving a Bootstrap page titled "DirectLine - Login"
    with no reference documentation behind it. Under the honest classification
    it is category (b), a login wall, not a developer portal.

    No OpenAPI or Swagger document was found anywhere. No GraphQL endpoint.
    No gRPC or .proto. No AsyncAPI, no webhook or event catalog. No public
    Postman workspace or collection (a Postman public search returned only an
    unrelated "Customer Direct Group" workspace by a third-party publisher).
    No /.well-known/openid-configuration and no
    /.well-known/oauth-authorization-server on any brand host — all 404. No
    security.txt.

    The company GitHub organization github.com/Direct-Line-Group exists
    (created 2019-07-03, "Direct Line org for all new code Projects") with
    zero public repositories; its profile link points at an internal
    ServiceNow knowledge-base article. Engineering exists; none of it is
    public.

    Market context: the UK has the FCA and PRA but no open-insurance
    obligation, and the FCA's Open Finance work remains consultation rather
    than rule. The UK's real market-wide data and API infrastructure effort is
    the London Market modernization programme (Blueprint Two, PPL, Whitespace,
    Ki), which is aimed at brokers and syndicates in the subscription market —
    a market Direct Line Group does not participate in. Direct Line Group also
    sold its brokered commercial business (NIG and FarmWeb) to RSA in
    September 2023, closing the one channel through which broker-standard
    integration would have run. What remains is a direct-to-consumer carrier
    whose only external "integration" is price-comparison-website placement,
    which is a commercial data feed relationship, not a published API.
  acordPosture: no ACORD reference found
  acordNote: |
    No mention of ACORD, AL3, ACORD XML, ACORD certification or NGDS was found
    on any Direct Line Group or brand property, nor in the group's public
    material. This is consistent with the UK personal-lines market, where
    broker/insurer data exchange runs on Polaris Standards and the imarket
    platform rather than on ACORD — and Direct Line Group is a direct writer
    that exited the brokered commercial channel with the 2023 NIG/FarmWeb sale
    to RSA, so it does not sit on that seam either.
  insuranceVerbs:
    quote:
      exposedViaApi: false
      note: Consumer web and telephone quote journeys only, plus
        price-comparison-website placement. No documented public quote API.
    bind:
      exposedViaApi: false
      note: No documented public bind API.
    issue:
      exposedViaApi: false
      note: No documented public policy-issue API.
    fnol:
      exposedViaApi: false
      note: Claims are notified by phone and through logged-in customer
        self-service. No documented public FNOL API.
  authModel: |
    No public authentication model is documented because no public API is
    offered. The only observable signal is at api.directlinegroup.co.uk, where
    the TLS handshake includes a CertificateRequest — the server asks for a
    client certificate, indicating mutual TLS for partner and internal
    consumers. docs.directline.com presents a form-based username/password
    login wall. No OAuth or OpenID Connect discovery document is served on any
    brand host.
  gated: true
  gatedNote: The only integration surface is partner/internal-gated (mTLS
    MuleSoft Anypoint gateway plus a form login wall). Nothing is self-serve.
  openapiHarvested: false
  specsCount: 0
  specsNote: No OpenAPI, Swagger, AsyncAPI, GraphQL SDL or .proto artifact was
    found, so no openapi/ directory was created.
  enrichmentRound:
    date: '2026-07-25'
    note: |
      Second pass (enrichment pipeline). The "no public API" conclusion stands
      after a wider hunt, but three things changed.

      1. A second gated API host exists that the first pass missed.
      api.bymiles.co.uk resolves and is an Amazon API Gateway deployment — the
      root returns HTTP 403 {"message":"Forbidden"} with x-amzn-errortype
      ForbiddenException and an x-amz-apigw-id header, and /v1/* returns
      {"message":"Missing Authentication Token"}. Its certificate is valid
      (CN=bymiles.co.uk, expires 2026-09-26). It is gated and undocumented, but it
      confirms a second, AWS-based integration estate alongside the group's
      MuleSoft gateway. api.darwin.co.uk also resolves to AWS anycast addresses
      but presents no certificate for that SNI name and cannot be probed.

      2. www.darwin.co.uk is NOT a Direct Line Group property and was recorded in
      error in the first pass. It serves a one-line HTML redirector to /lander,
      which forwards to forsale.godaddy.com/forsale/www.darwin.co.uk, and its
      /llms.txt is a GoDaddy aftermarket for-sale notice. The real Darwin brand
      site is www.darwin-insurance.com, whose footer states that policies are
      underwritten by U K Insurance Limited (FCA No. 536726) and arranged and
      administered by iGO4 Limited. apis.yml has been corrected.

      3. The group privacy notice was located at
      https://www.brandsprivacypolicy.co.uk/policy — published by U K Insurance
      Limited and covering Direct Line, Churchill, Privilege, Darwin and Green
      Flag. www.directline.com/app-privacy-policy 301s to it.

      Everything else re-confirmed negative. Forty-nine /.well-known/ probes across
      eleven hosts returned zero discovery documents (the HTTP 200s on
      www.privilege.com and docs.directline.com are soft 404s serving HTML
      templates, verified by body inspection). No security.txt, no OIDC or OAuth
      discovery, no api-catalog, no ai-plugin.json. No first-party package on npm,
      PyPI, Maven Central, NuGet, pkg.go.dev, RubyGems, Packagist or crates.io —
      npm hits for "direct-line" are all Microsoft Bot Framework Direct Line chat
      protocol clients, an unrelated namespace collision worth recording. The
      GitHub organization still has zero public repositories. No vulnerability
      disclosure programme and no trust center were found by keyword-verified
      probes of /security, /responsible-disclosure, /vulnerability-disclosure,
      trust.<domain> and security.<domain> across the estate.
  transports:
  - protocol: REST
    scheme: https
    baseURL: https://api.directlinegroup.co.uk/
    documented: false
    note: MuleSoft Anypoint production load balancer. HTTP 403 at root, expired
      TLS certificate (expired 2026-06-15), client certificate requested during
      TLS handshake. Not publicly documented and not publicly usable.
  - protocol: REST
    scheme: https
    baseURL: https://api.bymiles.co.uk/
    documented: false
    note: Amazon API Gateway. HTTP 403 {"message":"Forbidden"} at the root and
      {"message":"Missing Authentication Token"} under /v1/. Valid certificate
      (CN=bymiles.co.uk). Gated and undocumented. Discovered 2026-07-25 in the
      enrichment round.
  - protocol: GraphQL
    documented: false
    note: No /graphql surface found on any group or brand host.
  - protocol: gRPC
    documented: false
    note: No published .proto or gRPC endpoint.
  - protocol: WebSocket
    scheme: wss
    documented: false
    note: No WebSocket surface documented.
  - protocol: Webhooks
    documented: false
    note: No event catalog, webhook documentation or AsyncAPI published.
